<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="stylish.css">
</head>
<body>
    
    <header>
        
        <h1 style="color: red;">Student Registration Form</h1>
    </header>
    <form> 
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="studentName"
                placeholder="Enter your name">
            <br><br>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email">
            <br><br>
            <label for="age">Age:</label>
            <input
                type="number"
                id="age"
                name="age">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob">
            <br><br>
            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="BCA">BCA</option>
                <option value="B.Tech">B.Tech</option>
                <option value="MCA">MCA</option>
            </select>
            <br><br>
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Branch Selection</legend>
            <label for="branch">if course is Btech then select your branch  :</label>
            <br><br>
            <input
                type="radio"
                id="branch"
                name="branch"
                value="CSE"> CSE
            <br><br>
            <input
                type="radio"
                id="branch"
                name="branch"
                value="ECE"> ECE
            <br><br>
            <input
                type="radio" 
                id="branch"
                name="branch"
                value="CSIT"> CSIT
            <br><br>
            <input
                type="radio"
                id="branch"
                name="branch"
                value="CSE AI"> CSE AI
            <br><br> 
            <input
                type="radio"
                id="branch"
                name="branch"
                value="CSE DS"> CSE DS
            <br><br>
            <input
                type="radio"
                id="branch"
                name="branch"
                value="CSE Cyber Security"> CSE Cyber Security  
            <br><br>
            <input
                type="radio"
                id="branch"
                name="branch"
                value="CSE AIML"> CSE AIML
            
            <br><br>
            <button onclick="alert('Form submitted successfully!')">Register</button>
        </fieldset>
    </form>
</body>
</html>
